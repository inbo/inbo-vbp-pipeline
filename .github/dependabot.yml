version: 2
updates:
  - package-ecosystem: "npm"
    directory: "frontend/"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-all:
        applies-to: version-updates
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "lambdas/biocache-index-management/"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      biocache-index-management-all:
        applies-to: version-updates
      biocache-index-management-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/docker/*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        group-by: dependency-name
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        applies-to: version-updates
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
